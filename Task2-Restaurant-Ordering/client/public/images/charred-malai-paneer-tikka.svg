<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" role="img" aria-label="Illustration of charred malai paneer tikka skewers on a plate">
  <defs>
    <radialGradient id="table" cx="50%" cy="48%" r="75%">
      <stop offset="0" stop-color="#5a3a24"/>
      <stop offset="0.65" stop-color="#2f1e14"/>
      <stop offset="1" stop-color="#17100b"/>
    </radialGradient>
    <radialGradient id="plate" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="0.72" stop-color="#ebe3d4"/>
      <stop offset="1" stop-color="#bfb29c"/>
    </radialGradient>
    <linearGradient id="paneerTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="1" stop-color="#f1cf8b"/>
    </linearGradient>
    <linearGradient id="paneerSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eebf74"/>
      <stop offset="1" stop-color="#c98a3e"/>
    </linearGradient>
    <linearGradient id="skewer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d8d8d"/>
      <stop offset="0.5" stop-color="#e6e6e6"/>
      <stop offset="1" stop-color="#7c7c7c"/>
    </linearGradient>

    <g id="paneer">
      <path d="M-40 -28 L6 -46 L46 -24 L0 -6 Z" fill="url(#paneerTop)"/>
      <path d="M-40 -28 L0 -6 L0 42 L-40 20 Z" fill="url(#paneerSide)"/>
      <path d="M0 -6 L46 -24 L46 24 L0 42 Z" fill="#dca65c"/>
      <g stroke="#3a1f0d" stroke-linecap="round" fill="none" opacity="0.82">
        <path d="M-24 -28 L10 -14" stroke-width="6"/>
        <path d="M-9 -35 L26 -21" stroke-width="6"/>
        <path d="M-32 6 L-10 18" stroke-width="5"/>
        <path d="M12 22 L38 11" stroke-width="5"/>
      </g>
      <g fill="#7a9a3a">
        <circle cx="-14" cy="-20" r="2.6"/>
        <circle cx="18" cy="-32" r="2.2"/>
        <circle cx="24" cy="-16" r="2.6"/>
      </g>
    </g>

    <g id="capsicum">
      <path d="M-13 -42 C10 -48 20 -30 18 0 C17 28 8 44 -12 42 C-24 24 -24 -22 -13 -42 Z"/>
      <path d="M-4 -36 C8 -36 11 -20 10 0 C9 20 5 32 -5 34" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g id="onion">
      <ellipse cx="0" cy="0" rx="15" ry="38" fill="#b0497c"/>
      <ellipse cx="1" cy="0" rx="9" ry="29" fill="#f2d6e3"/>
      <ellipse cx="2" cy="0" rx="4" ry="19" fill="#c56a98"/>
    </g>

    <g id="mint">
      <path d="M0 0 C-22 -12 -24 -38 0 -54 C24 -38 22 -12 0 0 Z" fill="#3f8f3a"/>
      <path d="M0 -3 L0 -48 M0 -16 L-11 -26 M0 -16 L11 -26 M0 -30 L-9 -38 M0 -30 L9 -38" stroke="#b7dc8d" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <g id="tikkaSkewer">
      <rect x="-300" y="-5" width="600" height="10" rx="5" fill="url(#skewer)"/>
      <circle cx="-306" cy="0" r="13" fill="#8a8a8a"/>
      <circle cx="-306" cy="0" r="6" fill="#d9d9d9"/>
      <use xlink:href="#paneer" href="#paneer" x="-208"/>
      <use xlink:href="#capsicum" href="#capsicum" x="-146" fill="#4e9a3d"/>
      <use xlink:href="#paneer" href="#paneer" x="-84"/>
      <use xlink:href="#onion" href="#onion" x="-26"/>
      <use xlink:href="#paneer" href="#paneer" x="36"/>
      <use xlink:href="#capsicum" href="#capsicum" x="98" fill="#d0392b"/>
      <use xlink:href="#paneer" href="#paneer" x="160"/>
      <use xlink:href="#onion" href="#onion" x="218"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#table)"/>

  <ellipse cx="400" cy="322" rx="372" ry="252" fill="#000000" opacity="0.38"/>
  <ellipse cx="400" cy="306" rx="366" ry="248" fill="url(#plate)"/>
  <ellipse cx="400" cy="306" rx="312" ry="204" fill="none" stroke="#c9b48e" stroke-width="3" opacity="0.75"/>

  <g fill="none" stroke="#a9692d" stroke-width="9" stroke-linecap="round" opacity="0.5">
    <path d="M186 400 C260 440 348 432 420 452 C488 470 562 444 618 412"/>
  </g>

  <g transform="translate(395 222) rotate(-7)">
    <use xlink:href="#tikkaSkewer" href="#tikkaSkewer"/>
  </g>
  <g transform="translate(405 354) rotate(-7)">
    <use xlink:href="#tikkaSkewer" href="#tikkaSkewer"/>
  </g>

  <g transform="translate(628 462)">
    <path d="M-66 0 A66 66 0 0 1 66 0 Z" transform="rotate(-24)" fill="#f4c430"/>
    <path d="M-54 -2 A54 54 0 0 1 54 -2 Z" transform="rotate(-24)" fill="#fbe58a"/>
    <path d="M0 -2 L-44 -28 M0 -2 L-16 -50 M0 -2 L24 -46 M0 -2 L48 -18" transform="rotate(-24)" stroke="#f4c430" stroke-width="3"/>
  </g>

  <g transform="translate(182 454)">
    <ellipse cx="0" cy="8" rx="72" ry="44" fill="#6e6252" opacity="0.45"/>
    <ellipse cx="0" cy="0" rx="72" ry="44" fill="#f7f1e6"/>
    <ellipse cx="0" cy="-3" rx="58" ry="32" fill="#5f9c35"/>
    <path d="M-34 -8 C-12 -22 12 4 36 -10" fill="none" stroke="#a6cf6c" stroke-width="5" stroke-linecap="round"/>
  </g>

  <use xlink:href="#mint" href="#mint" transform="translate(496 474) rotate(38) scale(0.9)"/>
  <use xlink:href="#mint" href="#mint" transform="translate(488 480) rotate(-20) scale(0.8)"/>
  <use xlink:href="#mint" href="#mint" transform="translate(300 492) rotate(70) scale(0.7)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a ruby hibiscus berry spritz with ice, rosemary, raspberries and a hibiscus flower">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#4a1f3a"/>
      <stop offset="0.65" stop-color="#27101f"/>
      <stop offset="1" stop-color="#140810"/>
    </radialGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a24"/>
      <stop offset="1" stop-color="#2a1a10"/>
    </linearGradient>
    <linearGradient id="drink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d0d3f"/>
      <stop offset="0.45" stop-color="#c2124f"/>
      <stop offset="1" stop-color="#ec3f78"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffb3cd" stop-opacity="0.32"/>
    </linearGradient>
    <radialGradient id="raspberry" cx="36%" cy="30%" r="80%">
      <stop offset="0" stop-color="#f06292"/>
      <stop offset="1" stop-color="#a30f46"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7b0a3a"/>
      <stop offset="0.45" stop-color="#d11a5b"/>
      <stop offset="1" stop-color="#f25c8b"/>
    </linearGradient>
    <clipPath id="glassInner">
      <path d="M306 96 L494 96 L474 512 Q472 526 456 526 L344 526 Q328 526 326 512 Z"/>
    </clipPath>

    <rect id="cube" x="-34" y="-34" width="68" height="68" rx="11" fill="url(#ice)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>

    <g id="berry" fill="url(#raspberry)">
      <circle cx="-14" cy="-14" r="12"/><circle cx="6" cy="-18" r="12"/><circle cx="22" cy="-6" r="12"/>
      <circle cx="-22" cy="4" r="12"/><circle cx="0" cy="0" r="12"/><circle cx="18" cy="12" r="12"/>
      <circle cx="-10" cy="18" r="12"/><circle cx="8" cy="26" r="10"/>
    </g>

    <g id="flower">
      <path id="p" d="M0 0 C-44 -22 -50 -84 0 -112 C50 -84 44 -22 0 0 Z" fill="url(#petal)"/>
      <use href="#p" transform="rotate(72)"/>
      <use href="#p" transform="rotate(144)"/>
      <use href="#p" transform="rotate(216)"/>
      <use href="#p" transform="rotate(288)"/>
      <circle r="24" fill="#4f0626"/>
      <path d="M0 0 L38 -46" stroke="#f7c8d8" stroke-width="7" stroke-linecap="round"/>
      <g fill="#ffd54f">
        <circle cx="30" cy="-36" r="5.5"/><circle cx="40" cy="-48" r="5.5"/><circle cx="24" cy="-48" r="5"/><circle cx="42" cy="-34" r="5"/>
      </g>
    </g>

    <path id="needle" d="M0 0 C-9 -7 -9 -25 0 -35 C9 -25 9 -7 0 0 Z" fill="#4f7f3a"/>
  </defs>

  <rect width="800" height="600" fill="url(#backdrop)"/>
  <rect y="470" width="800" height="130" fill="url(#counter)"/>
  <ellipse cx="400" cy="532" rx="168" ry="30" fill="#000000" opacity="0.45"/>

  <g transform="translate(544 150) rotate(26)" stroke="#6b5430">
    <path d="M0 148 C-6 80 4 20 0 -102" fill="none" stroke-width="7" stroke-linecap="round"/>
    <g stroke="none">
      <use href="#needle" transform="translate(1 76) rotate(-58)"/>
      <use href="#needle" transform="translate(1 76) rotate(58)"/>
      <use href="#needle" transform="translate(1 42) rotate(-56)"/>
      <use href="#needle" transform="translate(1 42) rotate(56)"/>
      <use href="#needle" transform="translate(1 8) rotate(-54)"/>
      <use href="#needle" transform="translate(1 8) rotate(54)"/>
      <use href="#needle" transform="translate(1 -26) rotate(-50)"/>
      <use href="#needle" transform="translate(1 -26) rotate(50)"/>
      <use href="#needle" transform="translate(0 -60) rotate(-44)"/>
      <use href="#needle" transform="translate(0 -60) rotate(44)"/>
      <use href="#needle" transform="translate(0 -96)"/>
    </g>
  </g>

  <g clip-path="url(#glassInner)">
    <rect x="290" y="136" width="220" height="400" fill="url(#drink)"/>
    <ellipse cx="400" cy="136" rx="102" ry="12" fill="#f58cae" opacity="0.85"/>
    <use href="#cube" transform="translate(354 186) rotate(18)"/>
    <use href="#cube" transform="translate(440 178) rotate(-14)"/>
    <use href="#cube" transform="translate(396 256) rotate(34)"/>
    <use href="#berry" transform="translate(350 400) scale(1.1)"/>
    <use href="#berry" transform="translate(442 452)"/>
    <g fill="#ffffff" opacity="0.55">
      <circle cx="340" cy="320" r="5"/><circle cx="372" cy="356" r="3.5"/><circle cx="430" cy="330" r="4.5"/>
      <circle cx="456" cy="378" r="3.5"/><circle cx="404" cy="396" r="4"/><circle cx="346" cy="470" r="3.5"/>
      <circle cx="400" cy="486" r="4.5"/><circle cx="452" cy="280" r="3.5"/><circle cx="324" cy="250" r="3.5"/>
    </g>
  </g>

  <path d="M306 96 L494 96 L474 512 Q472 526 456 526 L344 526 Q328 526 326 512 Z" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="400" cy="96" rx="94" ry="10" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="4"/>
  <path d="M326 122 L342 490" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="11" stroke-linecap="round"/>

  <use href="#flower" transform="translate(166 448) scale(0.92)"/>
  <use href="#berry" transform="translate(604 520) scale(1.25)"/>
  <use href="#berry" transform="translate(680 540) scale(1.05)"/>
</svg>

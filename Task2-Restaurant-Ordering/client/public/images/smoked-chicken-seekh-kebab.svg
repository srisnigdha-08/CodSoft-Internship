      <path d="M0 -3 L0 -48 M0 -16 L-11 -26 M0 -16 L11 -26 M0 -30 L-9 -38 M0 -30 L9 -38" stroke="#b7dc8d" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>


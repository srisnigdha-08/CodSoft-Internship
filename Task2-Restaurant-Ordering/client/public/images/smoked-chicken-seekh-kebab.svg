      <circle cx="-326" cy="0" r="13" fill="#8a8a8a"/>
      <circle cx="-326" cy="0" r="6" fill="#d9d9d9"/>
      <g fill="url(#meat)">
        <ellipse cx="-232" cy="0" rx="52" ry="34"/>
        <ellipse cx="-170" cy="1" rx="52" ry="37"/>
        <ellipse cx="-106" cy="-1" rx="52" ry="35"/>
        <ellipse cx="-42" cy="1" rx="52" ry="37"/>
        <ellipse cx="22" cy="-1" rx="52" ry="35"/>
        <ellipse cx="86" cy="1" rx="52" ry="37"/>
        <ellipse cx="150" cy="-1" rx="52" ry="35"/>
        <ellipse cx="212" cy="0" rx="50" ry="33"/>
      </g>
      <g stroke="#2d1608" stroke-linecap="round" fill="none" opacity="0.85">
        <path d="M-220 -24 L-200 24" stroke-width="9"/>
        <path d="M-150 -27 L-130 26" stroke-width="9"/>
        <path d="M-80 -26 L-60 25" stroke-width="9"/>
        <path d="M-10 -27 L10 26" stroke-width="9"/>
        <path d="M60 -26 L80 25" stroke-width="9"/>
        <path d="M130 -26 L150 25" stroke-width="9"/>
        <path d="M196 -22 L212 20" stroke-width="8"/>
      </g>
      <g fill="#4f8a2e">
        <circle cx="-246" cy="-12" r="3.5"/>
        <circle cx="-176" cy="8" r="3.5"/>
        <circle cx="-116" cy="-14" r="3.5"/>
        <circle cx="-38" cy="12" r="3.5"/>
        <circle cx="30" cy="-14" r="3.5"/>
        <circle cx="104" cy="10" r="3.5"/>
        <circle cx="170" cy="-12" r="3.5"/>
        <circle cx="234" cy="6" r="3.5"/>
      </g>
      <g fill="#f4d9a8" opacity="0.8">
        <circle cx="-196" cy="-20" r="2.6"/>
        <circle cx="-102" cy="16" r="2.6"/>
        <circle cx="-22" cy="-20" r="2.6"/>
        <circle cx="52" cy="14" r="2.6"/>
        <circle cx="118" cy="-20" r="2.6"/>
      </g>
    </g>

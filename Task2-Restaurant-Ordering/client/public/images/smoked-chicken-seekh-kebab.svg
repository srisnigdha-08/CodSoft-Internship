<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of smoked chicken seekh kebab skewers with mint chutney, onion and lemon">
  <defs>
    <radialGradient id="table" cx="50%" cy="48%" r="75%">
      <stop offset="0" stop-color="#5a3a24"/>
      <stop offset="0.65" stop-color="#2f1e14"/>
      <stop offset="1" stop-color="#17100b"/>
    </radialGradient>
    <radialGradient id="plate" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="0.72" stop-color="#ebe3d4"/>
      <stop offset="1" stop-color="#bfb29c"/>
    </radialGradient>
    <linearGradient id="meat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d99a57"/>
      <stop offset="0.45" stop-color="#b26a2c"/>
      <stop offset="1" stop-color="#6e3a14"/>
    </linearGradient>
    <linearGradient id="skewer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d8d8d"/>
      <stop offset="0.5" stop-color="#e6e6e6"/>
      <stop offset="1" stop-color="#7c7c7c"/>
    </linearGradient>

    <g id="mint">

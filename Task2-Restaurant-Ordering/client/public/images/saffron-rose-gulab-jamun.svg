<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of gulab jamun in saffron syrup with pistachio slivers and rose petals">
  <defs>
    <radialGradient id="table" cx="50%" cy="48%" r="75%">
      <stop offset="0" stop-color="#5a3a24"/>
      <stop offset="0.65" stop-color="#2f1e14"/>
      <stop offset="1" stop-color="#17100b"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="0.5" stop-color="#c8953a"/>
      <stop offset="1" stop-color="#8f6420"/>
    </linearGradient>
    <radialGradient id="syrup" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#f7b733"/>
      <stop offset="0.7" stop-color="#d9861a"/>
      <stop offset="1" stop-color="#a55c10"/>
    </radialGradient>
    <radialGradient id="jamun" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#c97a32"/>
      <stop offset="0.42" stop-color="#8f4518"/>
      <stop offset="0.8" stop-color="#5a2810"/>
      <stop offset="1" stop-color="#3b1909"/>
    </radialGradient>

    <g id="sliver">
      <rect x="-15" y="-4" width="30" height="8" rx="4" fill="#8cc152"/>
      <rect x="-9" y="-1.5" width="18" height="3" rx="1.5" fill="#d3e8a8"/>
    </g>
    <path id="petal" d="M0 0 C-30 -14 -34 -48 0 -62 C34 -48 30 -14 0 0 Z"/>

    <g id="ball">
      <ellipse cx="0" cy="68" rx="76" ry="16" fill="#6b3a0c" opacity="0.55"/>
      <circle r="80" fill="url(#jamun)"/>
      <ellipse cx="-28" cy="-40" rx="27" ry="15" transform="rotate(-28 -28 -40)" fill="#ffe2b0" opacity="0.62"/>
      <ellipse cx="-44" cy="-16" rx="7" ry="4.5" fill="#ffe2b0" opacity="0.5"/>
      <path d="M-58 44 C-30 68 30 70 60 40" fill="none" stroke="#f0a03a" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    </g>

    <g id="garnish">
      <use href="#sliver" transform="translate(-10 -48) rotate(24)"/>
      <use href="#sliver" transform="translate(20 -36) rotate(-38)"/>
      <use href="#sliver" transform="translate(-30 -24) rotate(-14)"/>
      <path d="M2 -58 C14 -46 12 -34 26 -24 M-16 -36 C-6 -28 -14 -16 -2 -10" fill="none" stroke="#c81e1e" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#table)"/>

  <ellipse cx="400" cy="326" rx="372" ry="250" fill="#000000" opacity="0.4"/>
  <ellipse cx="400" cy="308" rx="366" ry="246" fill="url(#brass)"/>
  <ellipse cx="400" cy="308" rx="334" ry="218" fill="#7d5518"/>
  <ellipse cx="400" cy="312" rx="320" ry="204" fill="url(#syrup)"/>
  <g fill="none" stroke="#ffd98a" stroke-linecap="round" opacity="0.5">
    <path d="M150 300 C190 240 270 180 360 160" stroke-width="7"/>
    <path d="M640 360 C600 430 520 472 430 482" stroke-width="5"/>
  </g>

  <g>
    <use href="#ball" x="282" y="226"/>
    <use href="#garnish" x="282" y="226"/>
    <use href="#ball" x="434" y="196"/>
    <use href="#garnish" x="434" y="196"/>
    <use href="#ball" x="564" y="262"/>
    <use href="#garnish" x="564" y="262"/>
    <use href="#ball" x="338" y="370"/>
    <use href="#garnish" x="338" y="370"/>
    <use href="#ball" x="496" y="396"/>
    <use href="#garnish" x="496" y="396"/>
  </g>

  <g fill="#e0577f">
    <use href="#petal" transform="translate(180 410) rotate(-52)"/>
    <use href="#petal" transform="translate(632 438) rotate(58)" fill="#ee7d9c"/>
    <use href="#petal" transform="translate(420 512) rotate(170) scale(0.8)" fill="#d6456f"/>
  </g>
</svg>
